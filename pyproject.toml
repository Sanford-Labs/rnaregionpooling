[project]
name = "rnaregionpooling"
version = "0.1.0"
description = "Region-aware pooling of frozen mRNA foundation models: probes, controls, element analyses, tables and figures"
requires-python = ">=3.14,<3.15"
dependencies = [
  "torch==2.13.0",
  "numpy==2.5.2",
  "scipy==1.18.1",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "scikit-learn",
  "playwright",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
